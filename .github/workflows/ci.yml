name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Ladybug library
        uses: actions/cache@v4
        with:
          path: .lake/lbug
          key: lbug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lbug.lock') }}

      # The C shim needs a MinGW-w64 compiler with C library headers on Windows.
      - name: Install MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Put MinGW-w64 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"

      # Installs elan and the toolchain from lean-toolchain.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          use-github-cache: true

      - name: Build and test
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-test.sh
